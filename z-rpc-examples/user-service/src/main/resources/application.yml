server:
  # 不能和下面 z.rpc.server.port 用同一个 20880：Tomcat 先 bind，Netty 随后 BindException，
  # 整个应用起不来（250 机 JDK 8 实跑复现）。RPC 端口留给消费者拨号，HTTP 挪到 20881。
  port: 20881
  servlet:
    context-path: /

spring:
  application:
    name: user-service

z:
  rpc:
    enabled: true
    application:
      name: user-service
      version: 1.0.0
      organization: zifang
    registry:
      address: 127.0.0.1:8084
      type: z-config
      enabled: true
    server:
      host: 0.0.0.0
      port: 20880
      threads: 200
    protocol:
      name: z-rpc
      serialization: hessian2
    provider:
      weight: 100
      timeout: 5000

logging:
  level:
    com.zifang.z.rpc: INFO
    com.zifang.demo: DEBUG
