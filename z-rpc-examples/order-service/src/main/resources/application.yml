server:
  port: 20890
  servlet:
    context-path: /

spring:
  application:
    name: order-service

z:
  # z-ext 预置埋点自登记控制台（运行期可被控制台切换扩展点实现）
  ext:
    console:
      enabled: true
      url: ${ZEXT_CONSOLE_URL:http://192.168.31.136:8888}
  rpc:
    enabled: true
    application:
      name: order-service
      version: 1.0.0
      organization: zifang
    registry:
      address: 127.0.0.1:8084
      type: z-config
      enabled: true
    server:
      enabled: false
    consumer:
      timeout: 3000
      retries: 2
      loadbalance: random
      cluster: failover
      serialization: hessian2

logging:
  level:
    com.zifang.z.rpc: INFO
    com.zifang.demo: DEBUG
